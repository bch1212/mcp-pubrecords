# Smithery configuration for Halverson IQ Data.
# Smithery auto-indexes public GitHub repos with this file.
# https://smithery.ai/docs/build/project-config

startCommand:
  type: http
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        title: Halverson IQ Data API Key
        description: "Per-user API key. One key bills every tool on this server. Request a key from the operator; do not share a published dev key."
  exampleConfig:
    apiKey: YOUR_API_KEY

build:
  dockerfile: Dockerfile

server:
  remote:
    url: https://mcp-pubrecords-production.up.railway.app/mcp/
    headers:
      X-API-Key: "{apiKey}"
